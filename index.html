<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>KARTHIKEYA GOUD| Curated essentials</title>
	<style>
		:root {
			--ink: #18231f;
			--muted: #6c7771;
			--paper: #f7f7f3;
			--surface: #ffffff;
			--line: #e3e7df;
			--accent: #d95f39;
			--accent-dark: #ad3f22;
			--sage: #dfe9df;
			--shadow: 0 18px 50px rgba(24, 35, 31, .08);
		}

		* { box-sizing: border-box; }
		body { margin: 0; color: var(--ink); background: var(--paper); font-family: Georgia, "Times New Roman", serif; }
		button, input, select { font: inherit; }
		button { cursor: pointer; }
		.topbar { background: var(--ink); color: #fff; padding: 10px 6vw; text-align: center; font: 700 11px/1.2 Arial, sans-serif; letter-spacing: 1.5px; text-transform: uppercase; }
		header { padding: 26px 6vw 22px; background: var(--paper); border-bottom: 1px solid var(--line); }
		.nav { display: flex; align-items: center; justify-content: space-between; gap: 24px; max-width: 1240px; margin: auto; }
		.brand { color: var(--ink); font-size: 27px; font-weight: bold; letter-spacing: -.8px; text-decoration: none; }
		.brand span { color: var(--accent); }
		.nav-note { color: var(--muted); font: 12px Arial, sans-serif; letter-spacing: .7px; text-transform: uppercase; }
		.cart-button { display: inline-flex; align-items: center; gap: 9px; border: 0; color: #fff; background: var(--accent); padding: 12px 17px; font: 700 13px Arial, sans-serif; border-radius: 3px; }
		.cart-button:hover { background: var(--accent-dark); }
		.cart-count { display: grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; background: #fff; color: var(--accent-dark); border-radius: 50%; font-size: 11px; }
		main { max-width: 1240px; margin: auto; padding: 56px 6vw 90px; }
		.intro { display: grid; grid-template-columns: 1.4fr 1fr; align-items: end; gap: 30px; padding: 0 0 42px; }
		h1 { max-width: 670px; margin: 0; font-size: clamp(42px, 6vw, 78px); line-height: .95; letter-spacing: -3px; font-weight: 500; }
		.intro p { max-width: 300px; margin: 0 0 4px auto; color: var(--muted); font: 15px/1.6 Arial, sans-serif; }
		.controls { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 14px; margin-bottom: 30px; padding: 12px; background: var(--sage); }
		.search-wrap { position: relative; flex: 1 1 250px; }
		.search-wrap svg { position: absolute; left: 14px; top: 13px; width: 17px; color: var(--muted); }
		input, select { width: 100%; border: 1px solid transparent; border-radius: 2px; padding: 12px 14px; color: var(--ink); background: #fff; outline: 0; font: 14px Arial, sans-serif; }
		.search-wrap input { padding-left: 42px; }
		input:focus, select:focus { border-color: var(--accent); }
		.select-wrap { width: 190px; }
		.results-note { margin: 0 0 18px; color: var(--muted); font: 12px Arial, sans-serif; }
		.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 22px; }
		.product { min-width: 0; animation: rise .5s both; }
		.product-image { position: relative; display: grid; place-items: center; height: 280px; overflow: hidden; background: #fff; }
		.product-image img { width: 75%; height: 75%; object-fit: contain; transition: transform .35s ease; mix-blend-mode: multiply; }
		.product:hover img { transform: scale(1.06); }
		.product-info { padding: 16px 2px 4px; }
		.category { margin-bottom: 8px; color: var(--accent-dark); font: 10px Arial, sans-serif; letter-spacing: 1.2px; text-transform: uppercase; }
		.product h2 { height: 44px; overflow: hidden; margin: 0 0 13px; font-size: 17px; line-height: 1.3; font-weight: 500; }
		.product-bottom { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
		.price { font-size: 18px; font-weight: bold; }
		.add-button { border: 1px solid var(--ink); padding: 9px 12px; color: var(--ink); background: transparent; font: 700 11px Arial, sans-serif; text-transform: uppercase; }
		.add-button:hover { color: #fff; background: var(--ink); }
		.state { grid-column: 1 / -1; padding: 70px 20px; color: var(--muted); text-align: center; font: 14px Arial, sans-serif; }
		.state.error { color: var(--accent-dark); }
		.spinner { display: inline-block; width: 22px; height: 22px; margin-bottom: 12px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
		.drawer-backdrop { position: fixed; inset: 0; z-index: 5; visibility: hidden; background: rgba(24, 35, 31, .35); opacity: 0; transition: .25s; }
		.drawer-backdrop.open { visibility: visible; opacity: 1; }
		.drawer { position: absolute; top: 0; right: 0; display: flex; flex-direction: column; width: min(420px, 92vw); height: 100%; padding: 28px; background: var(--surface); transform: translateX(100%); transition: transform .3s ease; }
		.open .drawer { transform: translateX(0); }
		.drawer-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
		.drawer h2 { margin: 0; font-size: 28px; font-weight: 500; }
		.close-button { border: 0; color: var(--muted); background: transparent; font: 24px Arial, sans-serif; }
		.cart-items { flex: 1; overflow: auto; padding: 20px 0; }
		.cart-item { display: grid; grid-template-columns: 58px 1fr auto; gap: 13px; align-items: center; margin-bottom: 20px; }
		.cart-item img { width: 58px; height: 58px; padding: 5px; object-fit: contain; background: var(--paper); }
		.cart-item strong { display: block; margin-bottom: 6px; font-size: 14px; line-height: 1.25; }
		.cart-item small { color: var(--muted); font: 12px Arial, sans-serif; }
		.remove-button { border: 0; color: var(--accent-dark); background: none; font: 11px Arial, sans-serif; }
		.cart-footer { border-top: 1px solid var(--line); padding-top: 20px; }
		.total { display: flex; justify-content: space-between; margin-bottom: 18px; font-size: 20px; }
		.checkout { width: 100%; border: 0; padding: 14px; color: #fff; background: var(--ink); font: 700 12px Arial, sans-serif; letter-spacing: 1px; text-transform: uppercase; }
		.empty-cart { color: var(--muted); text-align: center; font: 14px/1.5 Arial, sans-serif; }
		@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
		@keyframes spin { to { transform: rotate(360deg); } }
		@media (max-width: 850px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } .intro { grid-template-columns: 1fr; } .intro p { margin-left: 0; } }
		@media (max-width: 580px) { .nav-note { display: none; } main { padding-top: 38px; } .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 14px; } .product-image { height: 210px; } h1 { letter-spacing: -2px; } .select-wrap { width: 100%; } }
	</style>
</head>
<body>
	<div class="topbar">Free delivery on orders over $50</div>
	<header>
		<nav class="nav" aria-label="Main navigation">
			<a class="brand" href="#">market<span>lane</span></a>
			<div class="nav-note">Thoughtful things, well chosen</div>
			<button class="cart-button" id="cart-toggle" aria-label="Open shopping cart">Cart <span class="cart-count" id="cart-count">0</span></button>
		</nav>
	</header>
	<main>
		<section class="intro">
			<h1>Good finds for everyday living.</h1>
			<p>A considered collection of useful, beautiful pieces for your home, wardrobe, and shelf.</p>
		</section>
		<section class="controls" aria-label="Product filters">
			<label class="search-wrap">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
				<input id="search" type="search" placeholder="Search the collection..." aria-label="Search products">
			</label>
			<label class="select-wrap"><select id="category" aria-label="Filter by category"><option value="all">All categories</option></select></label>
			<label class="select-wrap"><select id="sort" aria-label="Sort products"><option value="featured">Sort: Featured</option><option value="low">Price: Low to high</option><option value="high">Price: High to low</option><option value="rating">Top rated</option></select></label>
		</section>
		<p class="results-note" id="results-note">Loading the collection...</p>
		<section class="grid" id="product-grid" aria-live="polite"><div class="state"><span class="spinner"></span><br>Gathering good things...</div></section>
	</main>

	<div class="drawer-backdrop" id="drawer-backdrop">
		<aside class="drawer" aria-label="Shopping cart">
			<div class="drawer-header"><h2>Your cart</h2><button class="close-button" id="cart-close" aria-label="Close shopping cart">&times;</button></div>
			<div class="cart-items" id="cart-items"></div>
			<div class="cart-footer"><div class="total"><span>Total</span><strong id="cart-total">$0.00</strong></div><button class="checkout" id="checkout">Continue to checkout</button></div>
		</aside>
	</div>

	<script>
		const API_URL = 'https://fakestoreapi.com/products';
		let products = [];
		let cart = [];
		const grid = document.getElementById('product-grid');
		const search = document.getElementById('search');
		const category = document.getElementById('category');
		const sort = document.getElementById('sort');

		async function loadProducts() {
			try {
				const response = await fetch(API_URL);
				if (!response.ok) throw new Error('Unable to load products');
				products = await response.json();
				[...new Set(products.map(product => product.category))].sort().forEach(item => {
					category.insertAdjacentHTML('beforeend', `<option value="${item}">${item}</option>`);
				});
				renderProducts();
			} catch (error) {
				document.getElementById('results-note').textContent = 'The collection is unavailable right now.';
				grid.innerHTML = '<div class="state error">We could not reach the catalog. Please check your connection and refresh.</div>';
			}
		}

		function renderProducts() {
			const query = search.value.trim().toLowerCase();
			let visible = products.filter(product => (category.value === 'all' || product.category === category.value) && `${product.title} ${product.description}`.toLowerCase().includes(query));
			if (sort.value === 'low') visible.sort((a, b) => a.price - b.price);
			if (sort.value === 'high') visible.sort((a, b) => b.price - a.price);
			if (sort.value === 'rating') visible.sort((a, b) => b.rating.rate - a.rating.rate);
			document.getElementById('results-note').textContent = `${visible.length} ${visible.length === 1 ? 'piece' : 'pieces'} in the collection`;
			grid.innerHTML = visible.length ? visible.map((product, index) => `
				<article class="product" style="animation-delay:${Math.min(index * 45, 450)}ms">
					<div class="product-image"><img src="${product.image}" alt="${product.title}" loading="lazy"></div>
					<div class="product-info"><div class="category">${product.category}</div><h2 title="${product.title}">${product.title}</h2><div class="product-bottom"><span class="price">$${product.price.toFixed(2)}</span><button class="add-button" data-id="${product.id}">Add to cart</button></div></div>
				</article>`).join('') : '<div class="state">No pieces match that search.</div>';
		}

		function renderCart() {
			const count = cart.reduce((total, item) => total + item.quantity, 0);
			document.getElementById('cart-count').textContent = count;
			document.getElementById('cart-items').innerHTML = cart.length ? cart.map(item => `<div class="cart-item"><img src="${item.image}" alt=""><div><strong>${item.title}</strong><small>$${item.price.toFixed(2)} &times; ${item.quantity}</small></div><button class="remove-button" data-remove="${item.id}">Remove</button></div>`).join('') : '<p class="empty-cart">Your cart is waiting for something good.</p>';
			document.getElementById('cart-total').textContent = `$${cart.reduce((total, item) => total + item.price * item.quantity, 0).toFixed(2)}`;
		}

		grid.addEventListener('click', event => {
			const button = event.target.closest('[data-id]');
			if (!button) return;
			const product = products.find(item => item.id === Number(button.dataset.id));
			const existing = cart.find(item => item.id === product.id);
			existing ? existing.quantity++ : cart.push({ ...product, quantity: 1 });
			renderCart();
		});
		document.getElementById('cart-items').addEventListener('click', event => { if (event.target.dataset.remove) { cart = cart.filter(item => item.id !== Number(event.target.dataset.remove)); renderCart(); } });
		[search, category, sort].forEach(control => control.addEventListener('input', renderProducts));
		const backdrop = document.getElementById('drawer-backdrop');
		document.getElementById('cart-toggle').addEventListener('click', () => backdrop.classList.add('open'));
		document.getElementById('cart-close').addEventListener('click', () => backdrop.classList.remove('open'));
		backdrop.addEventListener('click', event => { if (event.target === backdrop) backdrop.classList.remove('open'); });
		document.getElementById('checkout').addEventListener('click', () => alert(cart.length ? 'Checkout is ready for the next step.' : 'Your cart is empty.'));
		renderCart();
		loadProducts();
	</script>
</body>
</html>
